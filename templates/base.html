<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Secure App{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="fixed top-4 right-4 z-50 space-y-2">
                {% for category, message in messages %}
                    <div class="px-4 py-3 rounded shadow-lg 
                        {% if category == 'success' %}bg-green-100 text-green-800 border-l-4 border-green-500
                        {% elif category == 'danger' %}bg-red-100 text-red-800 border-l-4 border-red-500
                        {% else %}bg-blue-100 text-blue-800 border-l-4 border-blue-500{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <main class="flex-grow flex items-center justify-center p-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-4 text-gray-500 text-sm">
        &copy; 2026 Secure App. Built with Flask & Tailwind.
    </footer>
</body>
</html>

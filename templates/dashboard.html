{% extends "base.html" %}

{% block title %}Dashboard - Secure App{% endblock %}

{% block content %}
<div class="text-center">
    <div class="bg-white p-10 rounded-xl shadow-lg max-w-2xl mx-auto">
        <div class="bg-blue-100 rounded-full h-24 w-24 flex items-center justify-center mx-auto mb-6">
            <svg class="h-12 w-12 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
        </div>
        <h1 class="text-4xl font-bold text-gray-800 mb-4">Welcome, {{ username }}!</h1>
        <p class="text-gray-600 mb-8 text-lg">You have successfully logged into the secure dashboard.</p>

        <div class="p-6 bg-gray-50 rounded-lg border border-gray-200 mb-8">
            <h3 class="font-bold text-gray-700 mb-2">Security Status</h3>
            <div class="flex items-center justify-center space-x-2 text-green-600 font-medium">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>Encrypted Session Active</span>
            </div>
        </div>

        <a href="{{ url_for('main.logout') }}">
            <button
                class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-8 rounded-full shadow transition duration-300 transform hover:scale-105">
                Log Out
            </button>
        </a>
    </div>
</div>
{% endblock %}
